name: Daily Marketing News Auto-Update

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0点（北京时间早上 8 点）自动运行一次
  workflow_dispatch: # 允许你随时在 GitHub 网页手动点击触发

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Auto-update daily marketing insights [skip ci]" || exit 0
          git push
